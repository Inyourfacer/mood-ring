name: Daily reminder

on:
  schedule:
    # GitHub runs frequent schedules irregularly and drops many of them, so this checks often,
    # away from the busy top of the hour. scripts/remind.mjs sends at most one reminder a day,
    # on the first run inside the window in config.json.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # "Run workflow" button = send a test notification now

permissions:
  contents: write # to record that today's reminder was sent

concurrency:
  group: reminder

jobs:
  remind:
    # The template repo itself has no devices, so don't run there.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/remind.mjs check
        env:
          EVENT: ${{ github.event_name }}
      - if: steps.check.outputs.send == 'true'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.send == 'true'
        run: node scripts/remind.mjs send
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          MESSAGE: ${{ steps.check.outputs.message }}
      - if: steps.check.outputs.send == 'true' && github.event_name == 'schedule'
        run: |
          echo "${{ steps.check.outputs.day }}" > push/last-reminder.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push/last-reminder.txt
          git commit -m "Reminder sent for ${{ steps.check.outputs.day }}"
          git pull --rebase origin main
          git push

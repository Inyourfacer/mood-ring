name: Daily reminder

on:
  schedule:
    # Cron times are UTC. Each reminder in config.json needs two lines: one for daylight saving
    # time and one for standard time. scripts/remind.mjs sends only on the one that matches.
    # America/Denver is UTC-6 in summer (MDT) and UTC-7 in winter (MST).
    - cron: "0 3 * * *"   # 21:00 MDT
    - cron: "0 4 * * *"   # 21:00 MST
    - cron: "30 4 * * *"  # 22:30 MDT
    - cron: "30 5 * * *"  # 22:30 MST
  workflow_dispatch: # "Run workflow" button = send a test notification now

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/remind.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
